# Only for writing new migrations. AgentForge migrates its own database when RunStore opens it.
# From the repository root:
#   .\.venv\Scripts\python.exe -m alembic -c apps/api/alembic.ini revision -m "what changes"
[alembic]
script_location = %(here)s/src/agentforge/migrations
# A scratch database for autogenerate; never point this at a real one.
sqlalchemy.url = sqlite:///%(here)s/scratch.db
