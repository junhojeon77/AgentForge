<meta charset="utf-8">
<title>AgentForge</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:496px; height:288px; }
  .accent { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .field { fill:var(--line); }
  .blk { rx:var(--radius-lg); }
  .t { rx:var(--radius-sm); }
  .t.ink { fill:var(--ink); }
  .t.work { fill:var(--working-edge); }
  .t.wait { fill:var(--waiting-edge); }
  .t.needs { fill:var(--needs-edge); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 496 288" width="496" height="288">
<!--
  blocks      accent 96x152 (petrol, the action colour, largest solid) · ink 96x104 (deep) · line 360x272 lane field bleeding off the top and right, about 40% of 960x288
  arrangement one stack of two slabs beside a wide field, bottoms on one line space-6 above the edge, space-4 gutter
  pattern     tiles in five lanes, from "agents work in parallel, each in its own worktree; a person stays in control": ink tiles are finished work, working-edge tiles run, waiting-edge tiles wait, and one needs-edge tile is the diff that waits for you
  scales      tile height space-6 at a 48px (space-6 x 2) lane pitch, gaps space-2; sides in space-2 multiples; corners radius-lg on blocks, radius-sm on tiles
-->
<rect class="accent blk" x="16" y="-8" width="96" height="152" rx="8"/>
<rect class="deep blk" x="16" y="160" width="96" height="104" rx="8"/>
<rect class="field blk" x="128" y="-8" width="368" height="272" rx="8"/>

<rect class="t ink" x="328" y="120" width="64" height="24" rx="4"/>

</div>
