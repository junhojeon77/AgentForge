*, *::before, *::after { box-sizing: border-box; }

  border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 13px; line-height: 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }

.af-btn--confirm:hover, .af-btn--confirm.is-hover { background: var(--danger-hover); border-color: var(--danger-hover); }

.af-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 8px 0 6px; border-radius: var(--radius-full);

.af-badge--needs   { background: var(--needs-soft);   color: var(--needs-ink); border-color: var(--needs-edge); }

.af-badge--problem { background: var(--problem-soft); color: var(--problem-ink); }
/* neutral groups: no fill; the word and the icon shape carry the status */
.af-badge--waiting, .af-badge--held, .af-badge--done, .af-badge--stopped { background: transparent; border-color: var(--line); }
.af-badge--waiting { color: var(--waiting-ink); }
.af-badge--held    { color: var(--held-ink); }
.af-badge--done    { color: var(--ink); }
.af-badge--done .af-icon { color: var(--done-ink); }
.af-badge--stopped { color: var(--stopped-ink); }

/* ---------- Status bar ---------- */
.af-statusbar { display: flex; align-items: center; gap: var(--space-2); height: var(--statusbar-h); padding: 0 var(--space-2) 0 var(--space-3);
  background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; line-height: 16px; color: var(--ink); }
.af-statusbar__text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.af-statusbar--ok .af-statusbar__icon { color: var(--done-ink); }
.af-statusbar--wait .af-statusbar__icon { color: var(--working-edge); }
.af-statusbar--needs { background: var(--needs-soft); color: var(--needs-ink); border-bottom-color: var(--needs-edge); }
.af-statusbar--bad { background: var(--problem-soft); color: var(--problem-ink); border-bottom-color: var(--problem-edge); }

.af-tabs { display: flex; gap: var(--space-1); padding: var(--space-2) var(--space-2) 0; border-bottom: 1px solid var(--line); }
.af-tab { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-muted); background: transparent; border: 0; border-bottom: 2px solid transparent;
  padding: 6px var(--space-2); cursor: pointer; }
.af-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.af-sidebar__heading { display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: var(--space-3) var(--space-3) var(--space-1);
  font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); }
.af-runlist { list-style: none; margin: 0; padding: 0 var(--space-2) var(--space-2); overflow: auto; min-height: 0; flex: 1; }
.af-runitem { position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: var(--space-1); width: 100%; min-height: 36px; padding: 6px var(--space-2) 6px var(--space-3);
  border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }

.af-runitem[aria-current="true"] { background: var(--selected); font-weight: 600; }
.af-runitem[aria-current="true"]::before { content: ""; position: absolute; left: 3px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.af-runitem__id { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }

.af-runitem .af-badge { height: 20px; font-size: 11px; }

  background: var(--needs-soft); color: var(--needs-ink); border: 1px solid var(--needs-edge); font-size: 11px; font-weight: 700; }

/* ---------- Page header ---------- */
.af-pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-2) var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--line); background: var(--canvas); }
.af-pagehead__main { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.af-pagehead__eyebrow { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin: 0; }
.af-pagehead__title { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 600; overflow-wrap: anywhere; }
.af-pagehead__meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: 12px; color: var(--ink-muted); }
.af-pagehead__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; justify-content: flex-end; }

/* ---------- Sections ---------- */
.af-section { display: flex; flex-direction: column; gap: var(--space-3); }
.af-section__title { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; display: flex; gap: var(--space-2); align-items: baseline; }
.af-section__title small { font-size: 12px; font-weight: 400; color: var(--ink-muted); }

/* ---------- Task card ---------- */
.af-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
.af-card--needs { border: 2px solid var(--needs-edge); }
.af-card__head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); padding: var(--space-3) var(--space-4); }
.af-card__title { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; overflow-wrap: anywhere; }
.af-card__status { grid-column: 2; grid-row: 1; }
.af-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px var(--space-3); margin: 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.af-meta code { color: var(--ink); }
.af-note { grid-column: 1 / -1; margin: var(--space-1) 0 0; font-size: 13px; line-height: 18px; color: var(--ink); overflow-wrap: anywhere; }
.af-note::before { content: "Note: "; color: var(--ink-muted); }
.af-card__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: 0 var(--space-4) var(--space-3); align-items: center; }
.af-card__actions .af-spacer { flex: 1; }

/* ---------- Attempt ---------- */
.af-attempt { border-top: 1px solid var(--line); }
.af-attempt > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4);
  font-size: 13px; line-height: 18px; cursor: pointer; }
.af-attempt > summary::-webkit-details-marker { display: none; }
.af-attempt > summary:hover { background: var(--hover); }
.af-attempt > summary .af-chev { color: var(--ink-muted); }
.af-attempt[open] > summary .af-chev { transform: rotate(90deg); }
.af-attempt__name { font-weight: 600; }
.af-attempt__sum { color: var(--ink-muted); font-size: 12px; }
.af-attempt__body { padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.af-label { display: block; margin: 0 0 var(--space-1); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); }

/* ---------- Diff viewer ---------- */
.af-diffbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-1); font-size: 12px; color: var(--ink-muted); }
.af-diffbar .af-spacer { flex: 1; }
.af-diff { font-family: var(--font-mono); font-size: 12px; line-height: 18px; background: var(--code-bg); border: 1px solid var(--line);
  border-radius: var(--radius-md); max-height: var(--diff-max-h); overflow: auto; margin: 0; }
.af-diff__inner { display: inline-block; min-width: 100%; padding: var(--space-1) 0; }
.af-dl { display: block; padding: 0 var(--space-3); white-space: pre; color: var(--diff-ctx-ink); }
.af-dl--add  { background: var(--diff-add-soft);  color: var(--diff-add-ink); }
.af-dl--del  { background: var(--diff-del-soft);  color: var(--diff-del-ink); }
.af-dl--hunk { background: var(--diff-hunk-soft); color: var(--diff-hunk-ink); }
.af-dl--file { background: var(--diff-file-soft); color: var(--diff-file-ink); font-weight: 600; }
.af-diff__empty { padding: var(--space-3); font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted); }

/* ---------- Long text ---------- */
.af-longtext { margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3);
  max-height: var(--longtext-max-h); overflow: auto; }

/* ---------- Review band ---------- */

.af-review { background: var(--needs-soft); color: var(--needs-ink); border-top: 2px solid var(--needs-edge); padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }

.af-review__q { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
.af-review__help { margin: 0; font-size: 12px; line-height: 16px; }
.af-review .af-field__label, .af-review .af-field__help { color: var(--needs-ink); }

/* ---------- Form fields ---------- */
.af-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.af-field__label { font-size: 13px; line-height: 16px; font-weight: 600; color: var(--ink); }
.af-field__help { font-size: 12px; line-height: 16px; color: var(--ink-muted); margin: 0; }
.af-field__error { font-size: 12px; line-height: 16px; color: var(--danger); margin: 0; display: flex; gap: var(--space-1); align-items: center; }
.af-input, .af-textarea, .af-select { width: 100%; font: inherit; font-size: 13px; line-height: 18px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 6px var(--space-2); }
.af-input, .af-select { height: var(--control-h); }
.af-textarea { min-height: 76px; resize: vertical; }

/* ---------- Inline confirm ---------- */
.af-confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  background: var(--danger-soft); border: 1px solid var(--danger); border-radius: var(--radius-lg); max-width: 100%; }
.af-confirm__q { margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }

/* ---------- Feedback ---------- */
.af-alert { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md);
  border: 1px solid; font-size: 13px; line-height: 18px; max-width: 100%; }
.af-alert .af-icon { margin-top: 1px; }
.af-alert__msg { flex: 1; min-width: 0; margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.af-alert__msg strong { font-weight: 600; }
.af-alert--problem { background: var(--problem-soft); color: var(--problem-ink); border-color: var(--problem-edge); }
.af-alert--needs   { background: var(--needs-soft);   color: var(--needs-ink);   border-color: var(--needs-edge); }
.af-alert--info    { background: var(--working-soft); color: var(--working-ink); border-color: var(--working-edge); }
.af-alert .af-btn--ghost { color: inherit; height: var(--control-h-sm); padding: 0 var(--space-2); font-size: 12px; }
.af-alert .af-btn--ghost:hover { background: transparent; text-decoration: underline; }
.af-loading { display: flex; flex-direction: column; gap: var(--space-3); }
.af-loading__line { display: flex; gap: var(--space-2); align-items: center; font-size: 14px; color: var(--ink-muted); }
.af-skel { background: var(--hover); border-radius: var(--radius-md); }

/* ---------- History table ---------- */
.af-tablewrap { max-height: var(--history-max-h); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.af-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 18px; }
.af-table caption { text-align: left; }
.af-table th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-muted);
  padding: 6px var(--space-3); border-bottom: 1px solid var(--line); white-space: nowrap; }
.af-table td { padding: 6px var(--space-3); border-bottom: 1px solid var(--line); vertical-align: top; }
.af-table tr:last-child td { border-bottom: 0; }
.af-table .num { width: 48px; text-align: right; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.af-table .id { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.af-table .reason { overflow-wrap: anywhere; min-width: 200px; }

/* ---------- Empty and disconnected ---------- */
.af-empty { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-8); max-width: 560px; }
.af-empty__title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; font-family: var(--font-display); }
.af-empty__text { margin: 0; color: var(--ink-muted); }
.af-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--space-2); }
.af-cmd { display: flex; align-items: center; gap: var(--space-2); background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 4px 4px 4px var(--space-3); font-family: var(--font-mono); font-size: 13px; }
.af-cmd code { flex: 1; font-size: 13px; }

/* ---------- Frame ---------- */
.af-frame { width: 1000px; height: 700px; display: flex; flex-direction: column; background: var(--canvas); border: 1px solid var(--line); overflow: hidden; }
.af-frame__body { flex: 1; min-height: 0; display: flex; }
.af-main { flex: 1; min-width: 0; overflow: auto; }
.af-main__inner { max-width: var(--content-max-w); padding: var(--space-4) var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.af-tasks { display: flex; flex-direction: column; gap: var(--space-3); }
